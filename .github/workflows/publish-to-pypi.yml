name: Publish Python 🐍 distribution 📦 to PyPI and TestPyPI

on:
  push:
    branches: [amifuse-0.6.0]
    tags: ['v*']

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        fetch-depth: 0  # Required for setuptools-scm to find tags
    - name: Fetch all tags
      run: git fetch --tags --force
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

  windows-machine68k:
    name: Upstream machine68k wheel (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
    - uses: actions/checkout@v6
      with:
        repository: cnvogelg/machine68k
        ref: 48f5e6d50cdeec3412a51f534f3695478eb08c90 # v0.5.0
        path: upstream-tests
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
    - name: Install build and test dependencies
      run: python -m pip install "setuptools>=77" "setuptools-scm>=8" "packaging>=24.2" cython "pytest<9.2" pytest-benchmark greenlet
    - name: Download the unmodified upstream source archive
      shell: bash
      run: |
        printf '%s\n' 'machine68k==0.5.0 --hash=sha256:7a702a86afc735b7069e183a6f52d57b9e203fa2260b926562721b76b7119050' > upstream-source.txt
        python -m pip download --no-deps --no-binary=:all: --no-build-isolation --require-hashes -r upstream-source.txt -d source
    - name: Build and install the upstream wheel
      shell: bash
      run: |
        python -m pip wheel --no-deps --no-build-isolation -w wheelhouse source/machine68k-0.5.0.tar.gz
        python -m pip install --no-index --find-links wheelhouse machine68k==0.5.0
        python -c "from importlib.metadata import version; import machine68k; assert version('machine68k') == '0.5.0'; print(machine68k.__file__)"
    - name: Test the installed upstream wheel
      run: python -m pytest upstream-tests/test -q --benchmark-disable
    - uses: actions/upload-artifact@v5
      with:
        name: machine68k-windows-${{ matrix.python-version }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  publish-windows-wheels:
    name: Attach upstream Windows wheels to the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-machine68k
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v6
      with:
        pattern: machine68k-windows-*
        merge-multiple: true
        path: wheelhouse
    - name: Create the release and attach Windows wheels
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_NOTES: |
          Rebased onto upstream amitools, including the scheduler changes.
          Requires Python 3.11 or newer and upstream machine68k 0.5.0 or newer.

          The attached Windows x64 wheels are built from the unmodified
          machine68k 0.5.0 source archive published by cnvogelg on PyPI.
          They are provided here because upstream publishes only a source
          archive. The old machine68k-amifuse distribution is no longer needed.
      run: |
        printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
        if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "amitools-amifuse $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
        fi
        gh release upload "$GITHUB_REF_NAME" wheelhouse/*.whl --repo "$GITHUB_REPOSITORY"

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
    - build
    - publish-windows-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/amitools-amifuse
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/amitools-amifuse

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v6
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
